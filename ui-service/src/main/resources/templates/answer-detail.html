<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail de la réponse</title>
</head>
<body>
<h1 th:text="${answerDTO.text}">Réponse</h1>
<p th:if="${answerDTO.correct}" style="color:green">✓ Correct</p>
<p th:if="${!answerDTO.correct}" style="color:red">✗ Incorrect</p>

<a th:href="@{/answers/edit/{id}(id=${answerDTO.id})}">Modifier</a>
<a th:href="@{/answers/delete/{id}(id=${answerDTO.id})}">Supprimer</a>
<a href="/answers">Retour</a>
</body>
</html>
