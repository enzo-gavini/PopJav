<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Détail de la question')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card">
        <h1 th:text="${questionDTO.text}">Question</h1>

        <div class="detail-section">
            <h2>Réponses</h2>
            <div class="cards">
                <div th:each="answer : ${questionDTO.answers}" class="card">
                    <div>
                        <h3 th:text="${answer.text}">Réponse</h3>
                    </div>
                    <span th:if="${answer.correct}" class="text-success">✓ Correct</span>
                    <span th:if="${!answer.correct}" class="text-danger">✗ Incorrect</span>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(questionDTO.answers)}" class="empty-state">
                Aucune réponse
            </div>
        </div>

        <div class="detail-actions">
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/edit/{id}(id=${questionDTO.id})}" class="card-btn-secondary">Modifier</a>
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/delete/{id}(id=${questionDTO.id})}" class="card-btn-danger">Supprimer</a>
            <a th:href="@{/questions}" class="card-btn">Retour</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
