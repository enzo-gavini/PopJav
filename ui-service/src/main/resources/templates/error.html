<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Erreur')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card detail-card-center">
        <h1 class="error-title">Oops !</h1>
        <p class="error-message" th:text="${message}">Une erreur est survenue</p>
        <a th:href="@{/}" class="card-btn error-btn">Retour à l'accueil</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
