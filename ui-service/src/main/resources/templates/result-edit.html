<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un résultat</title>
</head>
<body>
<h1>Modifier un résultat</h1>
<form th:action="@{/results/edit/{id}(id=${resultDTO.id})}" th:object="${resultDTO}" method="post">
    <input type="number" th:field="*{score}" placeholder="Score">
    <label>Complété : <input type="checkbox" th:field="*{completed}"></label>
    <input type="number" th:field="*{attempts}" placeholder="Tentatives">
    <input type="number" th:field="*{userId}" placeholder="Utilisateur">
    <input type="number" th:field="*{quizId}" placeholder="Quiz">
    <button type="submit">Modifier</button>
</form>
<a href="/results">Retour</a>
</body>
</html>
