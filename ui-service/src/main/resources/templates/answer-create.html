<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Créer une réponse')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Créer une réponse</h1>
<form th:action="@{/answers/create}" th:object="${answerDTO}" method="post">
    <input type="text" th:field="*{text}" placeholder="Texte">
    <label>Correct : <input type="checkbox" th:field="*{correct}"></label>
    <input type="number" th:field="*{questionId}" placeholder="Question">
    <button type="submit">Créer</button>
</form>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
