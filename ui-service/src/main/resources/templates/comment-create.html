<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Créer un commentaire')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="form-container">
    <div class="form-card">
        <h1 class="form-title">Créer un commentaire</h1>
        <form th:action="@{/comments/create}" th:object="${commentDTO}" method="post">
            <textarea th:field="*{text}" placeholder="Votre commentaire" class="form-input form-textarea"></textarea>
            <input type="hidden" th:field="*{userId}" value="1">
            <input type="hidden" th:field="*{lessonId}" value="1">
            <button type="submit" class="form-btn">Commenter</button>
        </form>
        <p class="form-link"><a th:href="@{/comments}">Retour aux commentaires</a></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
