<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Résultat du quiz')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="detail-container">
    <div class="detail-card" style="text-align:center;">
        <h1 th:if="${result.passed}" style="color:#22c55e;">Quiz réussi !</h1>
        <h1 th:if="${!result.passed}" style="color:#dc2626;">Quiz raté</h1>

        <div class="quiz-result-stats">
            <p class="quiz-result-score" th:text="${result.score} + '%'">0%</p>
            <p>Questions : <span th:text="${result.totalQuestions}">0</span></p>
            <p>Vies restantes : <span th:text="${result.livesRemaining}">0</span></p>
        </div>

        <div class="detail-section" style="text-align:left;">
            <h2>Détail des réponses</h2>
            <div th:each="detail : ${result.details}" class="quiz-result-detail">
                <div th:if="${detail.correct}" class="quiz-result-correct">
                    <p th:text="${detail.questionText}">Question</p>
                    <span>✓ Correct</span>
                </div>
                <div th:if="${!detail.correct}" class="quiz-result-incorrect">
                    <p th:text="${detail.questionText}">Question</p>
                    <span>✗ Incorrect</span>
                </div>
            </div>
        </div>

        <div class="detail-actions" style="justify-content:center;">
            <a th:href="@{/quizzes}" class="card-btn">Retour aux quiz</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
