<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Créer un résultat')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="form-container" id="main-content">
    <div class="form-card">
        <h1 class="form-title">Créer un résultat</h1>
        <form th:action="@{/results/create}" th:object="${resultDTO}" method="post">
            <input type="number" th:field="*{score}" placeholder="Score" class="form-input">
            <label class="form-checkbox">
                <input type="checkbox" th:field="*{completed}">
                Complété
            </label>
            <input type="number" th:field="*{attempts}" placeholder="Tentatives" class="form-input">
            <input type="number" th:field="*{userId}" placeholder="ID utilisateur" class="form-input">
            <input type="number" th:field="*{quizId}" placeholder="ID du quiz" class="form-input">
            <button type="submit" class="form-btn">Créer</button>
        </form>
        <p class="form-link"><a th:href="@{/results}">Retour aux résultats</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
