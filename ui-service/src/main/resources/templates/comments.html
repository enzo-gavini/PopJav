<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Commentaires')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow max-w-4xl mx-auto p-6 w-full" id="main-content">
    <h1 class="text-center text-3xl mb-6">Commentaires</h1>

    <div class="cards">
        <div th:each="comment : ${comments}" class="card">
            <div>
                <p th:text="${comment.text}">Commentaire</p>
                <small class="text-muted" th:text="${comment.displayDate}">Date</small>
            </div>
            <div class="flex gap-2 items-center">
                <a th:href="@{/comments/{id}(id=${comment.id})}" class="card-btn">Voir</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/comments/delete/{id}(id=${comment.id})}" class="card-btn-danger">Supprimer</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
