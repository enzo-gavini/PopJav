<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Questions')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Liste de questions</h1>
<a th:if="${session.role == 'ADMIN'}" href="/questions/create">Créer une question</a>

<div th:each="question : ${questions}">
    <h2 th:text="${question.text}">Text</h2>
    <a th:href="@{/questions/{id}(id=${question.id})}">Voir</a>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/edit/{id}(id=${question.id})}">Modifier</a>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/delete/{id}(id=${question.id})}">Supprimer</a>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
