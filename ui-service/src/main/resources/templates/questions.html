<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Questions')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow max-w-4xl mx-auto p-6 w-full">
    <h1 class="text-center text-3xl mb-6">Questions</h1>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/create}" class="card-btn mb-4 inline-block">Créer une question</a>

    <div class="cards">
        <div th:each="question : ${questions}" class="card">
            <div>
                <h3 th:text="${question.text}">Question</h3>
            </div>
            <div class="flex gap-2 items-center">
                <a th:href="@{/questions/{id}(id=${question.id})}" class="card-btn">Voir</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/edit/{id}(id=${question.id})}" class="card-btn-secondary">Modifier</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/questions/delete/{id}(id=${question.id})}" class="card-btn-danger">Supprimer</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
