<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quizs')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Liste des quizs</h1>
<a th:if="${session.role == 'ADMIN'}" href="/quizzes/create">Créer un quiz</a>

<div th:each="quiz : ${quizzes}">
    <h2 th:text="${quiz.title}">Titre</h2>
    <a th:href="@{/quizzes/play/{id}(id=${quiz.id})}">Jouer</a>
    <a th:href="@{/quizzes/{id}(id=${quiz.id})}">Voir</a>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/quizzes/edit/{id}(id=${quiz.id})}">Modifier</a>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/quizzes/delete/{id}(id=${quiz.id})}">Supprimer</a>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
