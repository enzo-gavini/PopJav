<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quiz')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow max-w-4xl mx-auto p-6 w-full">
    <h1 class="text-center text-3xl mb-6">Quiz</h1>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/quizzes/create}" class="card-btn mb-4 inline-block">Créer un quiz</a>

    <div class="cards">
        <div th:each="quiz : ${quizzes}" class="card">
            <div>
                <h3 th:text="${quiz.title}">Titre</h3>
            </div>
            <div class="flex gap-2 items-center">
                <a th:href="@{/quizzes/play/{id}(id=${quiz.id})}" class="card-btn">Jouer</a>
                <a th:href="@{/quizzes/{id}(id=${quiz.id})}" class="card-btn">Voir</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/quizzes/edit/{id}(id=${quiz.id})}" class="card-btn-secondary">Modifier</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/quizzes/delete/{id}(id=${quiz.id})}" class="card-btn-danger">Supprimer</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
