<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Modifier un chapitre')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="form-container-lg" id="main-content">
    <div class="form-card">
        <h1 class="form-title">Modifier un chapitre</h1>
        <form th:action="@{/chapters/edit/{id}(id=${chapterDTO.id})}" th:object="${chapterDTO}" method="post">
            <label for="title" class="form-label">Titre</label>
            <input type="text" th:field="*{title}" placeholder="Titre" class="form-input">
            <label for="description" class="form-label">Description</label>
            <textarea th:field="*{description}" placeholder="Description" class="form-input form-textarea"></textarea>
            <label for="orderIndex" class="form-label">Ordre</label>
            <input type="number" th:field="*{orderIndex}" placeholder="Ordre" class="form-input">
            <button type="submit" class="form-btn">Modifier</button>
        </form>
        <p class="form-link"><a th:href="@{/chapters}">Retour aux chapitres</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
