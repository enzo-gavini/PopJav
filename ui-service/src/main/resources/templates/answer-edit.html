<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Modifier une réponse')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="form-container" id="main-content">
    <div class="form-card">
        <h1 class="form-title">Modifier une réponse</h1>
        <form th:action="@{/answers/edit/{id}(id=${answerDTO.id})}" th:object="${answerDTO}" method="post">
            <input type="text" th:field="*{text}" placeholder="Texte de la réponse" class="form-input">
            <label class="form-checkbox">
                <input type="checkbox" th:field="*{correct}">
                Réponse correcte
            </label>
            <input type="number" th:field="*{questionId}" placeholder="ID de la question" class="form-input">
            <button type="submit" class="form-btn">Modifier</button>
        </form>
        <p class="form-link"><a th:href="@{/answers}">Retour aux réponses</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
