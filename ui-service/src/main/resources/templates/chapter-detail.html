<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Détail du chapitre')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card">
        <h1 th:text="${chapterDTO.title}">Titre</h1>
        <p th:text="${chapterDTO.description}">Description</p>
        <p>Ordre : <span th:text="${chapterDTO.orderIndex}">0</span></p>

        <div class="detail-section">
            <h2>Leçons</h2>
            <div class="cards">
                <div th:each="lesson : ${chapterDTO.lessons}" class="card">
                    <div>
                        <h3 th:text="${lesson.title}">Leçon</h3>
                    </div>
                    <a th:href="@{/lessons/{id}(id=${lesson.id})}" class="card-btn">Voir</a>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(chapterDTO.lessons)}" class="empty-state">
                Aucune leçon pour le moment
            </div>
        </div>

        <div class="detail-actions">
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/chapters/edit/{id}(id=${chapterDTO.id})}" class="card-btn-secondary">Modifier</a>
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/chapters/delete/{id}(id=${chapterDTO.id})}" class="card-btn-danger">Supprimer</a>
            <a th:href="@{/chapters}" class="card-btn">Retour</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
