<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Détail du résultat')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card">
        <h1>Résultat</h1>
        <p>Score : <span th:text="${resultDTO.score}">0</span>%</p>
        <p>Complété : <span th:text="${resultDTO.completed}">false</span></p>
        <p>Tentatives : <span th:text="${resultDTO.attempts}">0</span></p>

        <div class="detail-actions">
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/results/edit/{id}(id=${resultDTO.id})}" class="card-btn-secondary">Modifier</a>
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/results/delete/{id}(id=${resultDTO.id})}" class="card-btn-danger">Supprimer</a>
            <a th:href="@{/results}" class="card-btn">Retour</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
