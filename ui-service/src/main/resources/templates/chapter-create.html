<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Créer un chapitre')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="form-container-lg">
    <div class="form-card">
        <h1 class="form-title">Créer un chapitre</h1>
        <form th:action="@{/chapters/create}" th:object="${chapterDTO}" method="post">
            <input type="text" th:field="*{title}" placeholder="Titre" class="form-input">
            <textarea th:field="*{description}" placeholder="Description" class="form-input form-textarea"></textarea>
            <input type="number" th:field="*{orderIndex}" placeholder="Ordre" class="form-input">
            <button type="submit" class="form-btn">Créer</button>
        </form>
        <p class="form-link"><a th:href="@{/chapters}">Retour aux chapitres</a></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
