<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Modifier un quiz')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="form-container">
    <div class="form-card">
        <h1 class="form-title">Modifier un quiz</h1>
        <form th:action="@{/quizzes/edit/{id}(id=${quizDTO.id})}" th:object="${quizDTO}" method="post">
            <input type="text" th:field="*{title}" placeholder="Titre" class="form-input">
            <input type="number" th:field="*{lives}" placeholder="Nombre de vies" class="form-input">
            <input type="number" th:field="*{passingScore}" placeholder="Score de passage" class="form-input">
            <input type="number" th:field="*{lessonId}" placeholder="ID de la leçon" class="form-input">
            <button type="submit" class="form-btn">Modifier</button>
        </form>
        <p class="form-link"><a th:href="@{/quizzes}">Retour aux quiz</a></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
