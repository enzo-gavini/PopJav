<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leçons</title>
</head>
<body>
<h1>Liste des leçons</h1>
<a href="/lessons/create">Créer une leçons</a>

<div th:each="lesson : ${lessons}">
    <h2 th:text="${lesson.title}">Titre</h2>
    <p>Ordre : <span th:text="${lesson.orderIndex}">0</span></p>
    <a th:href="@{/lessons/{id}(id=${lesson.id})}">Voir</a>
    <a th:href="@{/lessons/edit/{id}(id=${lesson.id})}">Modifier</a>
    <a th:href="@{/lessons/delete/{id}(id=${lesson.id})}">Supprimer</a>
</div>
</body>
</html>
