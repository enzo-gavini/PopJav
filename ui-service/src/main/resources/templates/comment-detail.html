<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Détail du commentaire')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card">
        <h1>Commentaire</h1>
        <p th:text="${commentDTO.text}">Texte</p>
        <small class="text-muted" th:text="${commentDTO.createdAt}">Date</small>

        <div class="detail-actions">
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/comments/edit/{id}(id=${commentDTO.id})}" class="card-btn-secondary">Modifier</a>
            <a th:if="${session.role == 'ADMIN'}" th:href="@{/comments/delete/{id}(id=${commentDTO.id})}" class="card-btn-danger">Supprimer</a>
            <a th:href="@{/comments}" class="card-btn">Retour</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
