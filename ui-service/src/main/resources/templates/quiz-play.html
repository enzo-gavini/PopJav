<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quiz-partie')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<form th:action="@{/quizzes/play/{id}(id=${quiz.id})}" method="post">
    <div th:each="question : ${quiz.questions}">
        <h3 th:text="${question.text}">Questions</h3>

        <div th:each="answer : ${question.answers}">
            <label>
                <input type="radio"
                       th:name="'answers[' + ${question.id} + ']'"
                       th:value="${answer.id}">
                <span th:text="${answer.text}">Réponse</span>
            </label>
        </div>
    </div>
    <button type="submit">Valider</button>
</form>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
