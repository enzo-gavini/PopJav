<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quiz')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-container" id="main-content">
    <div class="detail-card detail-card-center">
        <h1 th:text="${quiz.title}">Quiz</h1>
        <p>Vies : <span th:text="${quiz.lives}">0</span></p>
        <p id="question-counter" class="quiz-counter">1 / 3</p>
        <p id="quiz-timer" class="quiz-timer"></p>

        <form th:action="@{/quizzes/play/{id}(id=${quiz.id})}" method="post">
            <div th:each="question : ${quiz.questions}" class="quiz-question">
                <h3 class="quiz-question-text" th:text="${question.text}">Question</h3>
                <div class="quiz-answers-grid">
                    <label th:each="answer : ${question.answers}" class="quiz-radio">
                        <input type="radio"
                               th:name="'answers[' + ${question.id} + ']'"
                               th:value="${answer.id}">
                        <span th:text="${answer.text}">Réponse</span>
                    </label>
                </div>
            </div>

            <div class="quiz-buttons">
                <button type="button" id="prev-btn" class="card-btn-secondary quiz-btn-prev">Précédent</button>
                <button type="button" id="next-btn" class="card-btn quiz-btn-next">Suivant</button>
                <button type="submit" id="submit-btn" class="form-btn quiz-btn-submit">Valider</button>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/quiz.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
