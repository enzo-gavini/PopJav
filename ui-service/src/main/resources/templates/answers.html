<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Réponses')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow max-w-4xl mx-auto p-6 w-full" id="main-content">
    <h1 class="text-center text-3xl mb-6">Réponses</h1>
    <a th:if="${session.role == 'ADMIN'}" th:href="@{/answers/create}" class="card-btn mb-4 inline-block">Créer une réponse</a>

    <div class="cards">
        <div th:each="answer : ${answers}" class="card">
            <div>
                <h3 th:text="${answer.text}">Réponse</h3>
                <span th:if="${answer.correct}" class="text-success">✓ Correct</span>
                <span th:if="${!answer.correct}" class="text-danger">✗ Incorrect</span>
            </div>
            <div class="flex gap-2 items-center">
                <a th:href="@{/answers/{id}(id=${answer.id})}" class="card-btn">Voir</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/answers/edit/{id}(id=${answer.id})}" class="card-btn-secondary">Modifier</a>
                <a th:if="${session.role == 'ADMIN'}" th:href="@{/answers/delete/{id}(id=${answer.id})}" class="card-btn-danger">Supprimer</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
