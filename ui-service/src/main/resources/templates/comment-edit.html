<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Modifier un commentaire')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Modifier un commentaire</h1>
<form th:action="@{/comments/edit/{id}(id=${commentDTO.id})}" th:object="${commentDTO}" method="post">
    <textarea th:field="*{text}" placeholder="Votre commentaire"></textarea>
    <button type="submit">Modifier</button>
</form>
<a href="/comments">Retour</a>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
